# JVM settings for Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Disable NDK side-by-side auto-download
android.ndk.symlinkDownload=false

# Disable external native build (prevents NDK usage)
android.defaults.buildfeatures.externalNativeBuild=false
android.externalNativeBuild.enabled=false
