plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // Firebase services
}

android {
    namespace = "com.example.crop_recommendation_app"

    // Use stable SDK 33 to avoid issues with SDK 34 and Java 21
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.crop_recommendation_app"
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Replace with your release signing config if needed
        }
    }

    // IMPORTANT: Do NOT specify ndkVersion here to avoid NDK usage
    // ndkVersion = flutter.ndkVersion // <-- Remove or comment out if present

    // Remove or comment out externalNativeBuild block if present
    // externalNativeBuild { ... }

    packagingOptions {
        exclude "**/*.so"
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-auth'
    // Add other Firebase or third-party dependencies if needed
}
